    <script>
      // Browser Extension (Urban VPN, proxy, ad blockers) compatibility shim for window.fetch
      (function() {
        try {
          var _origFetch = window.fetch;
          var _currentFetch = _origFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _currentFetch;
            },
            set: function(fn) {
              _currentFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          try {
            var _protoFetch = Window.prototype.fetch;
            Object.defineProperty(Window.prototype, 'fetch', {
              get: function() {
                return _currentFetch || _protoFetch;
              },
              set: function(fn) {
                _currentFetch = fn;
              },
              configurable: true,
              enumerable: true
            });
          } catch (e2) {}
        }

        // Suppress external extension errors (e.g. Urban VPN chrome-extension://...)
        window.addEventListener('error', function(event) {
          if (!event) return;
          var filename = event.filename || (event.error && event.error.stack) || '';
          var msg = event.message || '';
          if (
            (typeof filename === 'string' && (filename.indexOf('chrome-extension://') !== -1 || filename.indexOf('moz-extension://') !== -1)) ||
            (typeof msg === 'string' && msg.indexOf('Cannot set property fetch') !== -1)
          ) {
            event.preventDefault && event.preventDefault();
            event.stopImmediatePropagation && event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (!event) return;
          var reason = event.reason;
          var msg = (reason && reason.message) || String(reason || '');
          var stack = (reason && reason.stack) || '';
          if (
            msg.indexOf('Cannot set property fetch') !== -1 ||
            stack.indexOf('chrome-extension://') !== -1 ||
            stack.indexOf('moz-extension://') !== -1
          ) {
            event.preventDefault && event.preventDefault();
            event.stopImmediatePropagation && event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();

      try {
        var t = localStorage.getItem('daotam_theme');
        if (t === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
        } else {
          document.documentElement.classList.add('light');
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    </script>
